<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Track Math Calculator</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121214;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .calculator {
            background-color: #202024;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 8px 24px rgba(0,0,0,0.5);
            width: 260px;
        }
        .screen {
            background-color: #121214;
            color: #00e676;
            font-size: 2rem;
            text-align: right;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        button {
            padding: 18px;
            font-size: 1.2rem;
            border: none;
            border-radius: 6px;
            background-color: #29292e;
            color: #ffffff;
            cursor: pointer;
            transition: background 0.1s ease;
        }
        button:hover {
            background-color: #323238;
        }
        button.operator {
            background-color: #ff9800;
            color: #ffffff;
        }
        button.operator:hover {
            background-color: #ffa726;
        }
        button.clear {
            background-color: #e53935;
            color: #ffffff;
        }
        button.clear:hover {
            background-color: #ef5350;
        }
        button.equal {
            background-color: #00e676;
            color: #121214;
            font-weight: bold;
        }
        button.equal:hover {
            background-color: #69f0ae;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- The display area -->
        <div class="screen" id="display">0</div>
        
        <!-- The button grid layout -->
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button class="operator" onclick="pressKey('/')">/</button>
            <button class="operator" onclick="pressKey('*')">*</button>
            <button class="operator" onclick="pressKey('-')">-</button>

            <button onclick="pressKey('7')">7</button>
            <button onclick="pressKey('8')">8</button>
            <button onclick="pressKey('9')">9</button>
            <button class="operator" onclick="pressKey('+')">+</button>

            <button onclick="pressKey('4')">4</button>
            <button onclick="pressKey('5')">5</button>
            <button onclick="pressKey('6')">6</button>
            <button class="equal" onclick="calculate()">=</button>

            <button onclick="pressKey('1')">1</button>
            <button onclick="pressKey('2')">2</button>
            <button onclick="pressKey('3')">3</button>
            <button onclick="pressKey('0')">0</button>
        </div>
    </div>

    <!-- Injecting the JavaScript engine logic -->
    <script src="script.js"></script>
</body>
</html>
